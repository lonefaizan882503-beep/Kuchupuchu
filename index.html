<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Girlfriend's Day ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
color:white;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

#intro{
text-align:center;
}

h1{
font-size:38px;
color:#FFD700;
animation:glow 2s infinite alternate;
}

p{
margin-top:20px;
font-size:20px;
color:#ddd;
}

@keyframes glow{
from{
text-shadow:0 0 10px gold;
}
to{
text-shadow:0 0 40px gold;
}
}

button{
margin-top:40px;
padding:15px 35px;
font-size:20px;
border:none;
border-radius:50px;
background:gold;
cursor:pointer;
}
</style>

</head>

<body>

<div id="intro">

<h1>❤️ Happy Girlfriend's Day ❤️</h1>

<p>For My Kuchu Puchu ❤️</p>

<button onclick="startMovie()">
Open My Heart ❤️
</button>

</div>

<script>

function startMovie(){

window.location.href="movie.html";

}

</script>

</body>
</html>
